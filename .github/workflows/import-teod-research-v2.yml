          test "$(find teod-social/research/2026-10-v2 -type f | wc -l)" -eq 10
          file teod-social/research/2026-10-v2/*

      - name: Commit imported posters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TEOD Social Ops"
          git config user.email "actions@users.noreply.github.com"
          git add teod-social/research/2026-10-v2
          git diff --cached --quiet && exit 0
          git commit -m "assets: import exact TEOD Research v2 campaign posters"
          git push
