name: Import TEOD Research campaign v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-teod-research-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Import exact generated campaign posters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p teod-social/research/2026-10-v2

          curl -fL --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b5e96cba-1899-47f1-87a2-dd0c43fdbdb8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWQwMjk5ZWMxNmM4ZmQxMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE3Njk0MH0.1lSxBnDK067VhqPT6xTqtn8bll08oDwdY823tWwdCUk' -o teod-social/research/2026-10-v2/teod-research-v2-01.png
